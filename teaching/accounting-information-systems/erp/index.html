<!DOCTYPE html>

<title>Ledgerline ERP Simulator &middot; ACCT 360 &middot; Andrew Primmer</title>

<body>
<a class="skip" href="#view">Skip to content</a>
<header class="topbar">
  <button class="icon-btn menu" id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
